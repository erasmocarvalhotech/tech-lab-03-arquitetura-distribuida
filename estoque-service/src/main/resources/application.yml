server:
  port: 8082

spring:
  application:
    name: estoque-service

  datasource:
    url: jdbc:postgresql://localhost:5436/db_estoque
    username: ${POSTGRES_USER:techlab}
    password: ${POSTGRES_PASSWORD:techlab}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:techlab}
    password: ${RABBITMQ_DEFAULT_PASS:techlab}
    listener:
      simple:
        default-requeue-rejected: false

mb:
  techlab:
    stock:
      # Stream product-changed (Produto -> Estoque) - topologia declarada em infra/rabbitmq/definitions.json
      queue:
        product:
          changed: mb-techlab-stock-queue-product-changed
        # Stream reservation-requested (Pedido -> Estoque)
        reservation:
          requested: mb-techlab-stock-queue-reservation-requested
      # Stream reservation-processed (Estoque -> Pedido)
      exchange:
        topic:
          reservation:
            processed: mb-techlab-stock-exchange-topic-reservation-processed
      routing:
        key:
          reservation:
            processed: reservation-processed
    # Limite de retentativas (Decisao 7 do design.md): 1 tentativa inicial + 2 retries via -delayed
    retry:
      max-death-count: 2
